# Single source for the GitHub issue forms in .github/ISSUE_TEMPLATE/.
# GitHub forms cannot share fields, so ci/issue_forms.py expands the YAML
# anchors below into one self-contained form per entry in "forms".
# version_update.py regenerates them; "{version}" becomes the UI version.

shared:
  model: &model
    type: dropdown
    id: Joulescope-model
    attributes:
      label: Joulescope model
      description: Enter the Joulescope model connected to your computer.
      multiple: true
      options:
        - JS320
        - JS220
        - JS110
        - other

  version: &version
    type: dropdown
    id: version
    attributes:
      label: UI version
      description: What version of our software are you running?
      options:
        - "{version}"
        - 1.7.7
        - 1.7.0
        - other
    validations:
      required: true

  os_options: &os_options
    - Windows 11
    - Windows 10
    - macOS 26 arm64 (M1 and newer)
    - macOS 26 amd64
    - macOS 15 arm64 (M1 and newer)
    - macOS 15 amd64
    - macOS 14 arm64 (M1 and newer)
    - macOS 14 amd64
    - Linux Ubuntu amd64 (PC)
    - Linux Ubuntu arm64 (Raspberry Pi 4 & 5)
    - Other (describe below)

forms:
  bug_form:
    name: Bug report
    description: File a bug report
    title: "<title>"
    labels: ["bug", "triage"]
    assignees:
      - mliberty1
    body:
      - type: markdown
        attributes:
          value: Thanks for taking the time to fill out this bug report!
      - *model
      - *version
      - type: dropdown
        id: Environment
        attributes:
          label: What OS are you seeing the problem on?
          description: You can select multiple OS
          multiple: true
          options: *os_options
        validations:
          required: true
      - type: textarea
        id: what-happened
        attributes:
          label: What happened?
          placeholder: I encountered a bug
        validations:
          required: true
      - type: textarea
        id: what-expected
        attributes:
          label: What was expected?
          placeholder: UI should not crash
        validations:
          required: true
      - type: textarea
        id: how-reproduce
        attributes:
          label: How to reproduce?
          value: |
            1. ...
            2. ...
            3. ...
        validations:
          required: true
      - type: textarea
        id: extra-info
        attributes:
          label: Extra information
          description: Tell us anything that has not been explicitly asked but could help us.
          placeholder: Tell us anything useful

  enhancement_form:
    name: Enhancement request
    description: Propose enhancement to the tool
    title: "<title>"
    labels: ["enhancement", "triage"]
    assignees:
      - mliberty1
    body:
      - type: markdown
        attributes:
          value: Thanks for taking the time to share your ideas!
      - *model
      - *version
      - type: textarea
        id: enhancement
        attributes:
          label: Your idea
          placeholder: I would like a feature that...
        validations:
          required: true
      - type: dropdown
        id: Environment
        attributes:
          label: Does your idea concern a specific OS?
          description: You can select multiple OS
          multiple: true
          options: *os_options

  question_form:
    name: Question
    description: If you need help understanding or using our tool
    title: "<title>"
    labels: ["question", "triage"]
    assignees:
      - mliberty1
    body:
      - *model
      - *version
      - type: textarea
        id: Question
        attributes:
          label: Your question
          placeholder: How to ...
        validations:
          required: true
      - type: dropdown
        id: Environment
        attributes:
          label: What OS are you using?
          description: You can select multiple OS
          multiple: true
          options: *os_options
